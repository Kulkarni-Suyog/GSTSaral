[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__", "day1", "day2", "day3", "day4", "day5", "day6", "day7", "day8", "day9", "day10", "day12", "day13"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]