services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gstsaral-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - USE_OFFLINE_EMBED=${USE_OFFLINE_EMBED:-1}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gstsaral-ui
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    environment:
      - GSTSARAL_API_URL=http://api:8000
      - USE_OFFLINE_EMBED=${USE_OFFLINE_EMBED:-1}
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
